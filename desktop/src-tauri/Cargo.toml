[package]
name = "idy-notch"
version = "1.2.0"
description = "IDY · un notch vivo para Windows"
edition = "2021"

[lib]
name = "idy_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2.0.1"
tauri-plugin-opener = "2.0.0"
tauri-plugin-single-instance = "2.0.1"
tauri-plugin-drag = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
