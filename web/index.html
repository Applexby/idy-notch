<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IDY" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>IDY</title>
  <style>
    /* Splash instantáneo: se pinta antes de que cargue la app */
    html, body { background: #000; margin: 0; }
    #splash { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; transition: opacity .22s ease, transform .22s ease; }
    #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #splash .n { width: 112px; height: 38px; border-radius: 0 0 22px 22px; background: #0c0c0e; display: flex; gap: 16px; justify-content: center; align-items: center;
      box-shadow: 0 0 0 1px #2a2a2e, 0 10px 40px rgba(255,159,10,.22); animation: sp-in .3s cubic-bezier(.34,1.5,.5,1) both; }
    #splash i { width: 10px; height: 15px; border-radius: 6px; background: #fff; animation: sp-blink .42s ease .12s both, sp-look .5s ease .1s both; }
    @keyframes sp-in { from { transform: scale(.6); opacity: 0; } }
    @keyframes sp-blink { 0%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.1); } }
    @keyframes sp-look { 30% { translate: -2px 0; } 70% { translate: 2px 0; } }
  </style>
</head>
<body>
  <div id="splash"><div class="n"><i></i><i></i></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
