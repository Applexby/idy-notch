<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a2410"/><stop offset=".55" stop-color="#140d08"/><stop offset="1" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/><stop offset=".55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f1e6d6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="sq"><rect width="1024" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="600" rx="300" ry="330" fill="url(#rim)" opacity=".42" filter="url(#glow)"/>
    <g filter="url(#soft)">
      <!-- orejas tipo plátano, inclinadas hacia afuera -->
      <g transform="rotate(-24 372 300)"><path d="M372 150 C 318 210 318 330 352 400 L 400 400 C 424 320 420 210 372 150 Z" fill="url(#wool)"/>
        <path d="M372 200 C 342 250 342 330 362 380 L 390 380 C 404 320 402 250 372 200 Z" fill="#ff9a7a"/></g>
      <g transform="rotate(24 652 300)"><path d="M652 150 C 706 210 706 330 672 400 L 624 400 C 600 320 604 210 652 150 Z" fill="url(#wool)"/>
        <path d="M652 200 C 682 250 682 330 662 380 L 634 380 C 620 320 622 250 652 200 Z" fill="#ff9a7a"/></g>
      <!-- cuello largo hacia abajo -->
      <rect x="366" y="590" width="292" height="540" rx="130" fill="url(#wool)"/>
      <!-- cabeza -->
      <ellipse cx="512" cy="560" rx="214" ry="196" fill="url(#wool)"/>
      <!-- copete de lana rizada -->
      <g fill="#fffaf2">
        <circle cx="392" cy="392" r="62"/><circle cx="452" cy="352" r="70"/><circle cx="520" cy="338" r="74"/>
        <circle cx="588" cy="356" r="68"/><circle cx="640" cy="400" r="58"/><circle cx="486" cy="404" r="60"/><circle cx="560" cy="408" r="58"/>
      </g>
      <!-- hocico (relleno suave, sin contorno) -->
      <ellipse cx="512" cy="652" rx="112" ry="78" fill="#e9d7c0"/>
      <ellipse cx="482" cy="636" rx="11" ry="15" fill="#7a5a44"/><ellipse cx="542" cy="636" rx="11" ry="15" fill="#7a5a44"/>
      <path d="M484 676 Q 512 698 540 676" fill="none" stroke="#7a5a44" stroke-width="10" stroke-linecap="round"/>
      <!-- mejillas -->
      <ellipse cx="372" cy="600" rx="38" ry="24" fill="#ff8a5c" opacity=".45"/><ellipse cx="652" cy="600" rx="38" ry="24" fill="#ff8a5c" opacity=".45"/>
      <!-- ojos en cápsula (los de la mascota del notch) -->
      <rect x="414" y="482" width="44" height="86" rx="22" fill="#1b130d"/><rect x="566" y="482" width="44" height="86" rx="22" fill="#1b130d"/>
      <circle cx="444" cy="500" r="9" fill="#fff"/><circle cx="596" cy="500" r="9" fill="#fff"/>
    </g>
  </g>
</svg>
